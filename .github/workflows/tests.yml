name: Python Regression Test Selection CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.10', '3.11']

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run Unit Tests with Pytest
      run: |
        python -m pytest tests/ -v

    - name: Execute Reproducible Experiment Benchmarks
      run: |
        python experiments/run_experiments.py

    - name: Upload Experiment Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: experiment-results-${{ matrix.os }}-py${{ matrix.python-version }}
        path: |
          results/experiment_results.csv
          results/experiment_results.json
          results/experiment_summary.md
