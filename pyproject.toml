[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "dependency-aware-testing"
version = "1.0.0"
description = "Dependency-Aware Regression Test Selection for AI-Assisted Python Code Changes"
readme = "README.md"
authors = [{ name = "M.Tech AI Capstone" }]
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "streamlit>=1.30.0",
    "networkx>=3.0",
    "pandas>=2.0.0",
    "plotly>=5.18.0",
    "pytest>=8.0.0",
    "pytest-json-report>=1.5.0"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
